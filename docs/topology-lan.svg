<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
<title id="t">Talos: LAN mode topology</title>
<desc id="d">Each node has a private NIC for cluster traffic and a LAN NIC; API VIP, Gateway and LoadBalancer addresses come from lan.range.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
<rect width="900" height="780" fill="#ffffff"/>
<text x="20" y="32.0" text-anchor="start" font-size="18" fill="#1f2933" font-weight="600">Talos — LAN mode (lan section)</text>
<text x="20" y="52.0" text-anchor="start" font-size="12" fill="#52606d">Example: lan.range 192.0.2.200-229, 3 control planes + 2 workers.</text>
<rect x="20" y="70" width="860" height="200" rx="8" fill="#fdf5e6" stroke="#c98a1c" stroke-width="1.5"/>
<text x="32" y="90.0" text-anchor="start" font-size="13" fill="#c98a1c" font-weight="600">LAN  ·  lan.bridge (e.g. bridge0)  ·  192.0.2.0/24</text>
<rect x="40" y="104" width="240" height="62" rx="8" fill="#eef0f2" stroke="#7b8794" stroke-width="1.5"/>
<text x="160.0" y="131.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">Router .1</text>
<text x="160.0" y="148.1" text-anchor="middle" font-size="12" fill="#52606d">default gateway, DNS</text>
<rect x="300" y="104" width="260" height="62" rx="8" fill="#eef0f2" stroke="#7b8794" stroke-width="1.5"/>
<text x="430.0" y="131.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">LAN clients</text>
<text x="430.0" y="148.1" text-anchor="middle" font-size="12" fill="#52606d">kubectl, browsers, Argo CD UI</text>
<rect x="580" y="104" width="280" height="62" rx="8" fill="#eef0f2" stroke="#7b8794" stroke-width="1.5"/>
<text x="720.0" y="131.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">DNS (dns-records)</text>
<text x="720.0" y="148.1" text-anchor="middle" font-size="12" fill="#52606d">api.&lt;name&gt;: .200, *.apps: .204</text>
<text x="40" y="194.0" text-anchor="start" font-size="12" fill="#c98a1c" font-weight="600">lan.range</text>
<rect x="40" y="202" width="120" height="52" rx="4" fill="#f1e8fb" stroke="#7a4fb5" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="100.0" y="224.2" text-anchor="middle" font-size="12" fill="#1f2933" font-weight="600">.200</text>
<text x="100.0" y="240.2" text-anchor="middle" font-size="11" fill="#52606d">API VIP</text>
<rect x="160" y="202" width="180" height="52" rx="4" fill="#fde8e1" stroke="#c4572e" stroke-width="1.5"/>
<text x="250.0" y="224.2" text-anchor="middle" font-size="12" fill="#1f2933" font-weight="600">.201–.203</text>
<text x="250.0" y="240.2" text-anchor="middle" font-size="11" fill="#52606d">control planes</text>
<rect x="340" y="202" width="370" height="52" rx="4" fill="#f1e8fb" stroke="#7a4fb5" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="525.0" y="224.2" text-anchor="middle" font-size="12" fill="#1f2933" font-weight="600">.204–.227</text>
<text x="525.0" y="240.2" text-anchor="middle" font-size="11" fill="#52606d">LoadBalancer pool (.204 = ingress gateway)</text>
<rect x="710" y="202" width="150" height="52" rx="4" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="785.0" y="224.2" text-anchor="middle" font-size="12" fill="#1f2933" font-weight="600">.228–.229</text>
<text x="785.0" y="240.2" text-anchor="middle" font-size="11" fill="#52606d">workers</text>
<rect x="20" y="300" width="860" height="440" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="32" y="320.0" text-anchor="start" font-size="13" fill="#9aa5b1" font-weight="600">KVM host</text>
<rect x="40" y="660" width="400" height="58" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
<text x="240.0" y="685.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">deploy-talos.py, talosctl</text>
<text x="240.0" y="702.0" text-anchor="middle" font-size="12" fill="#52606d">Talos API only from the private network</text>
<rect x="460" y="660" width="400" height="58" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
<text x="660.0" y="685.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">Cilium (replaces flannel and kube-proxy)</text>
<text x="660.0" y="702.0" text-anchor="middle" font-size="12" fill="#52606d">Gateway API, L2 announcements (ARP on eth1)</text>
<path d="M240,660 L240,630" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M115,362 L115,270" fill="none" stroke="#c98a1c" stroke-width="1.6"/>
<path d="M115,454 L115,500" fill="none" stroke="#4a7fc1" stroke-width="1.6"/>
<rect x="40" y="362" width="150" height="92" rx="8" fill="#fde8e1" stroke="#c4572e" stroke-width="1.5"/>
<text x="115.0" y="395.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">cp-1</text>
<text x="115.0" y="412.6" text-anchor="middle" font-size="12" fill="#52606d">eth1  .201  (LAN)</text>
<text x="115.0" y="429.6" text-anchor="middle" font-size="12" fill="#52606d">eth0  .11  (private)</text>
<path d="M281,362 L281,270" fill="none" stroke="#c98a1c" stroke-width="1.6"/>
<path d="M281,454 L281,500" fill="none" stroke="#4a7fc1" stroke-width="1.6"/>
<rect x="206" y="362" width="150" height="92" rx="8" fill="#fde8e1" stroke="#c4572e" stroke-width="1.5"/>
<text x="281.0" y="395.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">cp-2</text>
<text x="281.0" y="412.6" text-anchor="middle" font-size="12" fill="#52606d">eth1  .202  (LAN)</text>
<text x="281.0" y="429.6" text-anchor="middle" font-size="12" fill="#52606d">eth0  .12  (private)</text>
<path d="M447,362 L447,270" fill="none" stroke="#c98a1c" stroke-width="1.6"/>
<path d="M447,454 L447,500" fill="none" stroke="#4a7fc1" stroke-width="1.6"/>
<rect x="372" y="362" width="150" height="92" rx="8" fill="#fde8e1" stroke="#c4572e" stroke-width="1.5"/>
<text x="447.0" y="395.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">cp-3</text>
<text x="447.0" y="412.6" text-anchor="middle" font-size="12" fill="#52606d">eth1  .203  (LAN)</text>
<text x="447.0" y="429.6" text-anchor="middle" font-size="12" fill="#52606d">eth0  .13  (private)</text>
<path d="M613,362 L613,270" fill="none" stroke="#c98a1c" stroke-width="1.6"/>
<path d="M613,454 L613,500" fill="none" stroke="#4a7fc1" stroke-width="1.6"/>
<rect x="538" y="362" width="150" height="92" rx="8" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="613.0" y="395.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">w-1</text>
<text x="613.0" y="412.6" text-anchor="middle" font-size="12" fill="#52606d">eth1  .229  (LAN)</text>
<text x="613.0" y="429.6" text-anchor="middle" font-size="12" fill="#52606d">eth0  .21  (private)</text>
<path d="M779,362 L779,270" fill="none" stroke="#c98a1c" stroke-width="1.6"/>
<path d="M779,454 L779,500" fill="none" stroke="#4a7fc1" stroke-width="1.6"/>
<rect x="704" y="362" width="150" height="92" rx="8" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="779.0" y="395.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">w-2</text>
<text x="779.0" y="412.6" text-anchor="middle" font-size="12" fill="#52606d">eth1  .228  (LAN)</text>
<text x="779.0" y="429.6" text-anchor="middle" font-size="12" fill="#52606d">eth0  .22  (private)</text>
<rect x="193.0" y="327" width="514.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="450" y="341.0" text-anchor="middle" font-size="12" fill="#52606d">eth1 bridged to the LAN: API VIP, Gateways, LoadBalancer IPs, default route</text>
<rect x="40" y="500" width="820" height="130" rx="8" fill="#e8f1fb" stroke="#4a7fc1" stroke-width="1.5"/>
<text x="52" y="520.0" text-anchor="start" font-size="13" fill="#4a7fc1" font-weight="600">private network  ·  created NAT network or existingBridge  ·  10.44.0.0/24</text>
<text x="60" y="550.0" text-anchor="start" font-size="13" fill="#1f2933">Cluster traffic stays here: etcd, kubelet, pod network, Talos API.</text>
<text x="60" y="572.0" text-anchor="start" font-size="12" fill="#52606d">Node services (Talos API 50000, trustd 50001, kubelet 10250, etcd 2379-2380) are firewalled</text>
<text x="60" y="590.0" text-anchor="start" font-size="12" fill="#52606d">to this network. IPv6 is disabled on eth1. The API VIP moves between control planes (~30 s).</text>
<text x="60" y="610.0" text-anchor="start" font-size="12" fill="#52606d">.1: gateway (NAT), DHCP, DNS for a created network.</text>
<rect x="40" y="755" width="16" height="12" rx="3" fill="#fde8e1" stroke="#c4572e" stroke-width="1.3"/>
<text x="62" y="766.0" text-anchor="start" font-size="12" fill="#52606d">control plane</text>
<rect x="190" y="755" width="16" height="12" rx="3" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.3"/>
<text x="212" y="766.0" text-anchor="start" font-size="12" fill="#52606d">worker</text>
<rect x="340" y="755" width="16" height="12" rx="3" fill="#f1e8fb" stroke="#7a4fb5" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="362" y="766.0" text-anchor="start" font-size="12" fill="#52606d">virtual IP</text>
<rect x="490" y="755" width="16" height="12" rx="3" fill="#e8f1fb" stroke="#4a7fc1" stroke-width="1.3"/>
<text x="512" y="766.0" text-anchor="start" font-size="12" fill="#52606d">network</text>
<rect x="640" y="755" width="16" height="12" rx="3" fill="#fdf5e6" stroke="#c98a1c" stroke-width="1.3"/>
<text x="662" y="766.0" text-anchor="start" font-size="12" fill="#52606d">LAN</text>
</svg>
