<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
<title id="t">Talos: integrations</title>
<desc id="d">How a cluster uses Keycloak, a Git server and the LAN DNS, and what the deploy script configures.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
<rect width="900" height="600" fill="#ffffff"/>
<text x="20" y="32.0" text-anchor="start" font-size="18" fill="#1f2933" font-weight="600">Talos — Argo CD, Keycloak and DNS</text>
<text x="20" y="52.0" text-anchor="start" font-size="12" fill="#52606d">Optional sections argocd and oidc; dns-records in LAN mode.</text>
<rect x="20" y="80" width="270" height="90" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
<text x="155.0" y="112.5" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">deploy-talos.py</text>
<text x="155.0" y="129.6" text-anchor="middle" font-size="12" fill="#52606d">plan, create, argocd, oidc</text>
<text x="155.0" y="146.6" text-anchor="middle" font-size="12" fill="#52606d">dns-records; kubeconfig</text>
<rect x="20" y="250" width="220" height="96" rx="8" fill="#eef0f2" stroke="#7b8794" stroke-width="1.5"/>
<text x="130.0" y="285.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">LAN DNS (e.g. OPNsense)</text>
<text x="130.0" y="302.6" text-anchor="middle" font-size="12" fill="#52606d">Dnsmasq host entries</text>
<text x="130.0" y="319.6" text-anchor="middle" font-size="12" fill="#52606d">owner deploy-*.py:&lt;name&gt;</text>
<path d="M100,170 L100,250" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="100.0" y="201" width="124.2" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="105" y="215.0" text-anchor="start" font-size="12" fill="#52606d">registration tool</text>
<rect x="320" y="80" width="560" height="330" rx="8" fill="#e8f1fb" stroke="#4a7fc1" stroke-width="1.5"/>
<text x="332" y="100.0" text-anchor="start" font-size="13" fill="#4a7fc1" font-weight="600">cluster</text>
<rect x="340" y="112" width="250" height="84" rx="8" fill="#fde8e1" stroke="#c4572e" stroke-width="1.5"/>
<text x="465.0" y="141.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">kube-apiserver</text>
<text x="465.0" y="158.6" text-anchor="middle" font-size="12" fill="#52606d">OIDC tokens, audience k8s-&lt;name&gt;</text>
<text x="465.0" y="175.6" text-anchor="middle" font-size="12" fill="#52606d">groups prefixed oidc:</text>
<rect x="610" y="112" width="250" height="84" rx="8" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="735.0" y="141.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">Argo CD (Helm chart)</text>
<text x="735.0" y="158.6" text-anchor="middle" font-size="12" fill="#52606d">namespace argocd</text>
<text x="735.0" y="175.6" text-anchor="middle" font-size="12" fill="#52606d">SSO client argocd-&lt;name&gt;</text>
<rect x="610" y="214" width="250" height="70" rx="8" fill="#f1e8fb" stroke="#7a4fb5" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="735.0" y="245.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">ingress gateway (LAN mode)</text>
<text x="735.0" y="262.1" text-anchor="middle" font-size="12" fill="#52606d">argocd.hostname, *.apps</text>
<rect x="340" y="214" width="250" height="70" rx="8" fill="#fde8e1" stroke="#c4572e" stroke-width="1.5"/>
<text x="465.0" y="245.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">oidc-cluster-admins</text>
<text x="465.0" y="262.1" text-anchor="middle" font-size="12" fill="#52606d">admin groups get cluster-admin</text>
<rect x="340" y="302" width="220" height="84" rx="8" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="450.0" y="331.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">root Application</text>
<text x="450.0" y="348.6" text-anchor="middle" font-size="12" fill="#52606d">syncs repository.path</text>
<text x="450.0" y="365.6" text-anchor="middle" font-size="12" fill="#52606d">automated, prune, self-heal</text>
<path d="M290,150 L340,150" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="450" width="270" height="110" rx="8" fill="#eef0f2" stroke="#7b8794" stroke-width="1.5"/>
<text x="155.0" y="484.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">Keycloak</text>
<text x="155.0" y="501.1" text-anchor="middle" font-size="12" fill="#52606d">realm, groups, clients</text>
<text x="155.0" y="518.0" text-anchor="middle" font-size="12" fill="#52606d">users log in here</text>
<text x="155.0" y="535.0" text-anchor="middle" font-size="12" fill="#52606d">OIDC issuer for cluster and Argo CD</text>
<path d="M265,170 L265,450" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="229.8" y="387" width="70.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="265" y="401.0" text-anchor="middle" font-size="12" fill="#52606d">admin API</text>
<path d="M320,395 L282,450" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="330" y="450" width="240" height="110" rx="8" fill="#eef0f2" stroke="#7b8794" stroke-width="1.5"/>
<text x="450.0" y="484.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">Git server (e.g. Forgejo)</text>
<text x="450.0" y="501.1" text-anchor="middle" font-size="12" fill="#52606d">repository, revision, path</text>
<text x="450.0" y="518.0" text-anchor="middle" font-size="12" fill="#52606d">read-only deploy key or token</text>
<text x="450.0" y="535.0" text-anchor="middle" font-size="12" fill="#52606d">polled every 3 min</text>
<path d="M450,386 L450,450" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="495.0" y="413" width="124.2" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="500" y="427.0" text-anchor="start" font-size="12" fill="#52606d">git (SSH / HTTPS)</text>
<rect x="610" y="450" width="270" height="110" rx="8" fill="#eef0f2" stroke="#7b8794" stroke-width="1.5"/>
<text x="745.0" y="484.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">Users</text>
<text x="745.0" y="501.1" text-anchor="middle" font-size="12" fill="#52606d">browser: console, Argo CD</text>
<text x="745.0" y="518.0" text-anchor="middle" font-size="12" fill="#52606d">kubectl: Keycloak login</text>
<text x="745.0" y="535.0" text-anchor="middle" font-size="12" fill="#52606d">by name, via LAN DNS</text>
<path d="M745,450 L745,284" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="723.2" y="359" width="43.6" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="745" y="373.0" text-anchor="middle" font-size="12" fill="#52606d">HTTPS</text>
<text x="450" y="588.0" text-anchor="middle" font-size="12" fill="#52606d">Dashed: the cluster fetches Keycloak's discovery document and keys; after login, Keycloak redirects back to the cluster.</text>
</svg>
