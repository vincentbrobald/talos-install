<text x="200.0" y="143.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">deploy-talos.py, kubectl, talosctl</text>
<text x="200.0" y="160.1" text-anchor="middle" font-size="12" fill="#52606d">&lt;name&gt;-cluster/: kubeconfig, talosconfig</text>
