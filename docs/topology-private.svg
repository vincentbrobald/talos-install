<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
<title id="t">Talos: private network topology</title>
<desc id="d">Nodes on a libvirt NAT network created for the cluster; only the host reaches them.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
<rect width="900" height="680" fill="#ffffff"/>
<text x="20" y="32.0" text-anchor="start" font-size="18" fill="#1f2933" font-weight="600">Talos — private network (default)</text>
<text x="20" y="52.0" text-anchor="start" font-size="12" fill="#52606d">Only this host reaches the cluster. Addresses for network.prefix 10.44.0 (the default).</text>
<rect x="600" y="14" width="280" height="50" rx="8" fill="#eef0f2" stroke="#7b8794" stroke-width="1.5"/>
